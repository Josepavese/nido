name: Create Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v3.0.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., v4.4.1)'
        required: true

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for changelog

      - name: Determine Version
        id: versioning
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_INPUT="$DISPATCH_VERSION"
          else
            VERSION_INPUT="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$VERSION_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION_INPUT"
            echo "Expected format: vX.Y.Z"
            exit 1
          fi
          echo "VERSION=$VERSION_INPUT" >> "$GITHUB_ENV"
          echo "version=$VERSION_INPUT" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          check-latest: true
          cache: true

      - name: Download Go modules
        run: bash bin/download-go-modules.sh

      - name: Install release packaging tools
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y jq zip; then
              exit 0
            fi
            echo "APT install attempt ${attempt} failed; retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Build release binaries
        run: |
          bash bin/build-release.sh ${{ env.VERSION }}

      - name: Generate release notes
        id: release_notes
        run: |
          # Use version from environment
          TAG=${{ env.VERSION }}
          REV="$TAG"
          if ! git rev-parse --verify "$TAG^{commit}" >/dev/null 2>&1; then
            REV="HEAD"
          fi
          
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 "$REV^" 2>/dev/null || echo "")
          
          # Determine if this is a major/minor/patch release
          if [[ $TAG =~ v([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            MAJOR=${BASH_REMATCH[1]}
            MINOR=${BASH_REMATCH[2]}
            PATCH=${BASH_REMATCH[3]}
          fi
          
          # Generate witty intro based on version type
          if [ "$PATCH" = "0" ] && [ "$MINOR" = "0" ]; then
            INTRO="🎉 **Major Release Alert!** The bird has evolved significantly. This is a big one, folks."
          elif [ "$PATCH" = "0" ]; then
            INTRO="🐣 **New Features Hatched!** The nest got some shiny new additions."
          else
            INTRO="🔧 **Maintenance Release** - Bug fixes and polish. Even birds need grooming."
          fi
          
          # Generate changelog with categorization
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s|||%h" "$REV")
            CHANGELOG_URL="https://github.com/Josepavese/nido/commits/$TAG"
          else
            COMMITS=$(git log --pretty=format:"%s|||%h" "$PREV_TAG..$REV")
            CHANGELOG_URL="https://github.com/Josepavese/nido/compare/$PREV_TAG...$TAG"
          fi
          
          # Categorize commits
          FEATURES=""
          FIXES=""
          DOCS=""
          CHORES=""
          TESTS=""
          CI=""
          
          while IFS='|||' read -r msg hash; do
            if [[ $msg =~ ^feat ]]; then
              FEATURES="${FEATURES}\n* ${msg#feat: } (\`${hash}\`)"
            elif [[ $msg =~ ^fix ]]; then
              FIXES="${FIXES}\n* ${msg#fix: } (\`${hash}\`)"
            elif [[ $msg =~ ^docs ]]; then
              DOCS="${DOCS}\n* ${msg#docs: } (\`${hash}\`)"
            elif [[ $msg =~ ^test ]]; then
              TESTS="${TESTS}\n* ${msg#test: } (\`${hash}\`)"
            elif [[ $msg =~ ^ci ]]; then
              CI="${CI}\n* ${msg#ci: } (\`${hash}\`)"
            elif [[ $msg =~ ^chore ]]; then
              CHORES="${CHORES}\n* ${msg#chore: } (\`${hash}\`)"
            else
              CHORES="${CHORES}\n* ${msg} (\`${hash}\`)"
            fi
          done <<< "$COMMITS"
          
          # Create release notes with Nido personality
          cat > release_notes.md << EOF
          ## 🪺 Nido $TAG
          
          $INTRO
          
          EOF
          
          # Add sections only if they have content
          if [ -n "$FEATURES" ]; then
            cat >> release_notes.md << EOF
          ### ✨ New Features
          
          The bird learned some new tricks:
          $(echo -e "$FEATURES")
          
          EOF
          fi
          
          if [ -n "$FIXES" ]; then
            cat >> release_notes.md << EOF
          ### 🐛 Bug Fixes
          
          Squashed these pesky bugs (they were bothering the VMs):
          $(echo -e "$FIXES")
          
          EOF
          fi
          
          if [ -n "$DOCS" ]; then
            cat >> release_notes.md << EOF
          ### 📚 Documentation
          
          Made the docs more readable (and funnier):
          $(echo -e "$DOCS")
          
          EOF
          fi
          
          if [ -n "$CI" ]; then
            cat >> release_notes.md << EOF
          ### 🤖 CI/CD
          
          Robot improvements (the machines are getting smarter):
          $(echo -e "$CI")
          
          EOF
          fi
          
          if [ -n "$TESTS" ]; then
            cat >> release_notes.md << EOF
          ### 🧪 Tests
          
          More tests = more confidence:
          $(echo -e "$TESTS")
          
          EOF
          fi
          
          if [ -n "$CHORES" ]; then
            cat >> release_notes.md << EOF
          ### 🧹 Housekeeping
          
          The boring but necessary stuff:
          $(echo -e "$CHORES")
          
          EOF
          fi
          
          # Add installation instructions
          cat >> release_notes.md << EOF
          ---
          
          ### 📦 Installation
          
          Pick your platform and get hatching:

          #### Quick install
          \`\`\`bash
          curl -fsSL https://github.com/Josepavese/nido/releases/download/$TAG/install.sh | bash
          \`\`\`

          \`\`\`powershell
          irm https://github.com/Josepavese/nido/releases/download/$TAG/install.ps1 | iex
          \`\`\`
          
          npm (\`nido-mcp\`), Homebrew, Scoop, Go and WinGet availability are covered in the
          [installation guide](https://github.com/Josepavese/nido/blob/main/installers/README.md).
          For AI clients, the same guide links the Official MCP Registry, Glama and the
          MCPB bundle, with [client setup](https://github.com/Josepavese/nido/blob/main/docs/mcp.md).

          #### Linux
          \`\`\`bash
          curl -L https://github.com/Josepavese/nido/releases/download/$TAG/nido-linux-amd64.tar.gz -o nido.tar.gz
          tar -xzf nido.tar.gz
          cd nido-linux-amd64
          chmod +x nido
          sudo mv nido /usr/local/bin/
          nido version  # Should show $TAG
          \`\`\`

          #### Linux (ARM64)
          \`\`\`bash
          curl -L https://github.com/Josepavese/nido/releases/download/$TAG/nido-linux-arm64.tar.gz -o nido.tar.gz
          tar -xzf nido.tar.gz
          cd nido-linux-arm64
          chmod +x nido
          sudo mv nido /usr/local/bin/
          \`\`\`
          
          #### macOS (Intel)
          \`\`\`bash
          curl -L https://github.com/Josepavese/nido/releases/download/$TAG/nido-darwin-amd64.tar.gz -o nido.tar.gz
          tar -xzf nido.tar.gz
          cd nido-darwin-amd64
          chmod +x nido
          sudo mv nido /usr/local/bin/
          \`\`\`
          
          #### macOS (Apple Silicon)
          \`\`\`bash
          curl -L https://github.com/Josepavese/nido/releases/download/$TAG/nido-darwin-arm64.tar.gz -o nido.tar.gz
          tar -xzf nido.tar.gz
          cd nido-darwin-arm64
          chmod +x nido
          sudo mv nido /usr/local/bin/
          \`\`\`
          
          #### Windows
          Download \`nido-windows-amd64.zip\` from the assets below, extract, and add the folder to your PATH.
          
          ---
          
          ### 🔗 Links
          
          * **Full Changelog:** $CHANGELOG_URL
          * **Documentation:** https://github.com/Josepavese/nido#readme
          * **Issues:** https://github.com/Josepavese/nido/issues
          
          ---
          
          <p align="center">
            <i>Made with ❤️ for the Agentic future.</i><br>
            <i>"It's not a VM, it's a lifestyle."</i> 🪺
          </p>
          EOF

      - name: Verify dist contents
        run: |
          ls -R dist/
          bash bin/verify-release.sh --local dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          body_path: release_notes.md
          files: |
            dist/nido-linux-amd64.tar.gz
            dist/nido-linux-arm64.tar.gz
            dist/nido-darwin-amd64.tar.gz
            dist/nido-darwin-arm64.tar.gz
            dist/nido-windows-amd64.zip
            dist/nido.mcpb
            dist/server.json
            dist/install.sh
            dist/install.ps1
            dist/SHA256SUMS
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote Flavour Assets
        run: |
          # Get current tag
          TAG=${{ env.VERSION }}
          REV="$TAG"
          if ! git rev-parse --verify "$TAG^{commit}" >/dev/null 2>&1; then
            REV="HEAD"
          fi
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 "$REV^" 2>/dev/null || echo "")
          
          if [ -n "$PREV_TAG" ]; then
            echo "🛸 Promoting flavour assets from $PREV_TAG to $TAG..."
            bash bin/promote-assets.sh "$PREV_TAG" "$TAG"
          else
            echo "ℹ️ No previous tag found. Skipping asset promotion."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload MCP server manifest
        uses: actions/upload-artifact@v7
        with:
          name: mcp-server-json
          path: dist/server.json
          if-no-files-found: error
          retention-days: 3

  # Kept out of the release job: the check dispatches upstream-dependent
  # scheduled workflows (image catalog refreshes), so a transient upstream
  # failure must never block release artifacts or distribution channels.
  # The registry validates that the npm version advertised in server.json
  # exists, so this runs after the npm publish job. If npm publishing is
  # disabled (trusted publisher variable absent), the manifest is published
  # without the npm entry instead of failing the release.
  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: [release, publish-npm]
    if: always() && needs.release.result == 'success' && needs.publish-npm.result != 'failure' && needs.publish-npm.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: 'v1.7.8'
      MCP_PUBLISHER_SHA256: '48230dbec85bd88a0d42977ef533cddda23235f0db4331b9263ce53b432cb75c'
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - name: Download MCP server manifest
        uses: actions/download-artifact@v7
        with:
          name: mcp-server-json

      - name: Drop npm package entry when npm publishing is disabled
        if: needs.publish-npm.result == 'skipped'
        run: |
          echo "npm publishing disabled: publishing server.json without the npm package entry."
          jq '.packages |= map(select(.registryType != "npm"))' server.json > server.tmp.json
          mv server.tmp.json server.json
          jq -r '.packages[].registryType' server.json

      - name: Wait for the npm version to be available
        if: needs.publish-npm.result == 'success'
        run: |
          version="${VERSION#v}"
          echo "⏳ Waiting for nido-mcp@${version} to appear on the npm registry..."
          # npm processes new releases asynchronously (publish-time scanning), and
          # the registry validates that this version exists before accepting the
          # server, so poll with a bounded backoff instead of racing the publish.
          for attempt in $(seq 1 45); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/nido-mcp/${version}")
            if [ "$status" = "200" ]; then
              echo "✓ nido-mcp@${version} is available after ${attempt} attempt(s)."
              exit 0
            fi
            echo "  attempt ${attempt}: HTTP ${status}, retrying in 20s"
            sleep 20
          done
          echo "::error::nido-mcp@${version} did not appear on the npm registry within 15 minutes."
          exit 1

      - name: Install mcp-publisher
        run: |
          echo "📥 Installing mcp-publisher..."
          curl -fsSL --retry 3 --retry-delay 5 -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz
          chmod +x mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
          mcp-publisher --version

      - name: Publish to MCP Registry
        run: |
          echo "🚀 Publishing to MCP Registry..."
          mcp-publisher login github-oidc
          for attempt in 1 2 3; do
            if mcp-publisher publish --yes; then
              exit 0
            fi
            echo "registry publish attempt ${attempt} failed; retrying in 30s"
            sleep 30
          done
          echo "::error::MCP Registry publish failed after 3 attempts."
          exit 1

  verify_scheduled:
    name: Verify scheduled automation
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify scheduled automation workflows
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULED_WORKFLOW_REF: main
        run: bash bin/verify-scheduled-workflows.sh

  dist_gate:
    name: Resolve distribution channels
    needs: release
    runs-on: ubuntu-latest
    outputs:
      winget: ${{ steps.gate.outputs.winget }}
      scoop: ${{ steps.gate.outputs.scoop }}
      aur: ${{ steps.gate.outputs.aur }}
      smithery: ${{ steps.gate.outputs.smithery }}
    steps:
      - name: Check which channel secrets are configured
        id: gate
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: |
          emit() {
            if [ -n "${2:-}" ]; then echo "$1=true"; else echo "$1=false"; fi
          }
          {
            emit winget "$WINGET_TOKEN"
            emit scoop "$SCOOP_BUCKET_TOKEN"
            emit aur "$AUR_SSH_PRIVATE_KEY"
            emit smithery "$SMITHERY_API_KEY"
          } >> "$GITHUB_OUTPUT"
          echo "Channels:" && cat "$GITHUB_OUTPUT"

  publish-npm:
    name: Publish to npm (trusted publishing)
    needs: release
    if: vars.NPM_TRUSTED_PUBLISHER == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: npm
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Sync package version with the release tag
        run: npm version "${VERSION#v}" --no-git-tag-version --allow-same-version

      - name: Check the MCP Registry identity
        run: |
          expected=$(jq -r '.name' ../server.json)
          actual=$(jq -r '.mcpName // empty' package.json)
          if [ "$actual" != "$expected" ]; then
            echo "::error::npm/package.json mcpName ('$actual') must match server.json name ('$expected'); the MCP Registry rejects npm packages without it."
            exit 1
          fi
          echo "✓ mcpName matches $expected"

      - name: Publish (OIDC, no long-lived token)
        run: npm publish --access public

  publish-winget:
    name: Publish to WinGet
    needs: [release, dist_gate]
    if: needs.dist_gate.outputs.winget == 'true'
    runs-on: ubuntu-latest
    # The PR is merged by WinGet moderators: never fail the release on it.
    continue-on-error: true
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - name: Update WinGet manifest
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Josepavese.Nido
          installers-regex: '\.zip$'
          max-versions-to-keep: 5
          fork-user: Josepavese
          release-tag: ${{ env.VERSION }}
          token: ${{ secrets.WINGET_TOKEN }}

  publish-scoop:
    name: Publish to Scoop bucket
    needs: [release, dist_gate]
    if: needs.dist_gate.outputs.scoop == 'true'
    runs-on: windows-latest
    continue-on-error: true
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - name: Checkout bucket
        uses: actions/checkout@v6
        with:
          repository: Josepavese/scoop-nido
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: bucket-repo

      - name: Update manifest and push
        shell: pwsh
        working-directory: bucket-repo
        run: |
          $tag = $env:VERSION
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          $version = $tag.Substring(1)
          $sums = Invoke-RestMethod "https://github.com/Josepavese/nido/releases/download/$tag/SHA256SUMS"
          $sha = ($sums -split "`n" | Where-Object { $_ -match 'nido-windows-amd64\.zip' } | Select-Object -First 1).Trim().Split(' ')[0]
          if (-not $sha) { throw "SHA256 for nido-windows-amd64.zip not found" }
          $manifestPath = 'bucket/nido.json'
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $manifest.version = $version
          $manifest.architecture.'64bit'.url = "https://github.com/Josepavese/nido/releases/download/$tag/nido-windows-amd64.zip"
          $manifest.architecture.'64bit'.hash = $sha
          $json = $manifest | ConvertTo-Json -Depth 10
          # Write UTF-8 without BOM: Scoop parsers expect a plain JSON file.
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) $manifestPath), $json)
          if (-not (git status --porcelain)) {
            Write-Host 'Manifest already up to date'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $manifestPath
          git commit -m "nido@$tag: update manifest"
          git push

  publish-aur:
    name: Publish to AUR
    needs: [release, dist_gate]
    if: needs.dist_gate.outputs.aur == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Render PKGBUILD
        run: |
          set -euo pipefail
          tag="$VERSION"
          [[ "$tag" == v* ]] || tag="v$tag"
          version="${tag#v}"
          sums=$(curl -fsSL "https://github.com/Josepavese/nido/releases/download/${tag}/SHA256SUMS")
          sha=$(printf '%s\n' "$sums" | awk '$2 == "nido-linux-amd64.tar.gz" { print $1 }')
          test -n "$sha"
          sed -e "s/__PKGVER__/${version}/" -e "s/__SHA256__/${sha}/" \
            distribution/aur/PKGBUILD.in > PKGBUILD
          cat PKGBUILD

      - name: Push to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: nido-bin
          pkgbuild: ./PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME || 'Josepavese' }}
          commit_email: ${{ secrets.AUR_EMAIL || 'josepavese@users.noreply.github.com' }}
          commit_message: "nido-bin ${{ env.VERSION }}"
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  publish-smithery:
    name: Publish to Smithery
    needs: [release, dist_gate]
    if: needs.dist_gate.outputs.smithery == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download the MCP bundle from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$VERSION"
          [[ "$tag" == v* ]] || tag="v$tag"
          gh release download "$tag" --pattern nido.mcpb --dir dist
          ls -l dist/nido.mcpb

      - name: Publish to Smithery
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: |
          set -euo pipefail
          npm install -g smithery@latest
          smithery mcp publish ./dist/nido.mcpb -n josepavese/nido

  # Zero-credential container channel: GHCR accepts the workflow token, and the
  # image is rebuilt from the published release assets on every tag. The image
  # bootstraps QEMU and is meant for hosts that expose /dev/kvm; it does not
  # replace a native install for GUI/desktop use.
  publish-container:
    name: Publish container image
    needs: [release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      IMAGE: ghcr.io/josepavese/nido
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download and stage the Linux binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$VERSION"
          [[ "$tag" == v* ]] || tag="v$tag"
          gh release download "$tag" --pattern nido-linux-amd64.tar.gz --dir dist
          tar -xzf dist/nido-linux-amd64.tar.gz -C dist
          install -d image
          cp distribution/docker/Dockerfile image/Dockerfile
          install -m 0755 dist/nido-linux-amd64/nido image/nido
          install -m 0755 dist/nido-linux-amd64/nido-validator image/nido-validator

      - name: Resolve image tags
        id: tags
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: image
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.tags.outputs.minor }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Nido
            org.opencontainers.image.description=Local VM manager for AI agents: QEMU/KVM virtual machines through MCP, CLI or TUI.
            org.opencontainers.image.licenses=MIT

      - name: Make the package public (first publish only)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PATCH /user/packages/container/nido -f visibility=public

  # Zero-credential distro repositories: the workflow token pushes a single
  # compact gh-pages commit, and GitHub Pages serves APT (Debian/Ubuntu) and
  # DNF (Fedora/RHEL) metadata rebuilt from the release binaries. The
  # PACKAGES_GPG_KEY repository secret signs the APT Release/InRelease, the RPM
  # packages and the DNF repomd; the public keyring lives in the repository and
  # is served from Pages.
  publish-packages:
    name: Publish APT/DNF repositories
    needs: [release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      NFPM_VERSION: v2.48.0
      KEEP_VERSIONS: "5"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          check-latest: true

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils createrepo-c rpm gnupg
          go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check out the previous gh-pages tree
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            git worktree add --detach previous-site FETCH_HEAD
          fi

      - name: Build the repositories
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGES_GPG_KEY: ${{ secrets.PACKAGES_GPG_KEY }}
          PREVIOUS_SITE_DIR: ${{ github.workspace }}/previous-site
        run: bin/publish-packages.sh "$VERSION"

      - name: Publish to the gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          site_dir="$(mktemp -d)"
          git -C "$site_dir" init -q -b gh-pages
          rsync -a --delete build/packages-site/ "$site_dir/"
          git -C "$site_dir" add -A
          if git -C "$site_dir" diff --cached --quiet; then
            echo "Packages are already up to date"
            exit 0
          fi
          git -C "$site_dir" -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "Packages $VERSION"
          # Rewriting the branch keeps the repository small: package history is
          # not useful and each release would otherwise add ~25 MB of objects.
          git -C "$site_dir" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$site_dir" push -q -f origin gh-pages

      - name: Ensure GitHub Pages serves the branch
        continue-on-error: true
        run: |
          printf '%s' '{"source":{"branch":"gh-pages","path":"/"}}' \
            | gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" --input - >/dev/null
