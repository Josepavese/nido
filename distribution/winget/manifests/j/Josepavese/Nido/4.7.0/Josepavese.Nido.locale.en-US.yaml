ShortDescription: Local VM manager for AI agents, with CLI, TUI and native MCP
Description: Nido manages local QEMU virtual machines for AI agents through a CLI, a terminal dashboard and a native Model Context Protocol (MCP) server. Use cloud images, copy-on-write disks, reusable templates, cloud-init provisioning, SSH and forwarded ports for development and testing. QEMU must be installed separately (for example `winget install SoftwareFreedomConservancy.QEMU`).
