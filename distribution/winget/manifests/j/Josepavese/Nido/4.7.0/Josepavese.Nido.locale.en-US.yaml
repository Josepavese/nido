ShortDescription: MCP-native VM manager for AI agents: fast local QEMU/KVM VM sandboxes
Description: Nido is an MCP-native VM manager for AI agents: it spawns real QEMU/KVM virtual machines for autonomous agents. It ships linked clones, cloud images, templates, SSH/port forwarding and a native Model Context Protocol (MCP) server. QEMU must be installed separately (for example `winget install SoftwareFreedomConservancy.QEMU`).
